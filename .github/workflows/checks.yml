name: Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          set -euxo pipefail
          pip install -U -r requirements.txt
          bash build.sh
      # https://github.com/actions/upload-artifact
      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: upload-build
          path: _build/html/
          if-no-files-found: error

  build-flatland-rl-main:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          set -euxo pipefail
          pip install -U -r requirements.txt
          pip install -U git+https://github.com/flatland-association/flatland-rl.git
          bash build.sh
      # https://github.com/actions/upload-artifact
      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: upload-build-main
          path: _build/html/
          if-no-files-found: error
          
  build-bib:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1

      - name: Generate bibliography.md from references.bib
        run: |
          pandoc -f markdown resources/bibliography/bibliography_gen.md \
            --csl=resources/bibliography/agu-chrono.csl \
            --lua-filter=resources/bibliography/group-by-year.lua \
            -t gfm \
            --wrap=none \
            -o resources/bibliography.md